[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-racing"
version = "0.1.0"
description = "Deterministic desktop racing simulator"
requires-python = ">=3.11"
dependencies = ["numpy", "pygame", "PyYAML", "jsonschema"]

[project.scripts]
racing-play = "racing.render.app:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
rl = []
analytics = []

[tool.setuptools.packages.find]
include = ["racing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"racing.tracks" = ["*.json"]

[tool.setuptools.data-files]
"share/ai-racing/configs" = ["configs/game.yaml", "configs/physics.yaml"]
"share/ai-racing/assets/tracks" = ["assets/tracks/demo.json"]
